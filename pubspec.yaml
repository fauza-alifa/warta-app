name: news_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Berisi API key. File ini di-ignore oleh git (lihat .env.example).
    - .env

# Logo aplikasi → jalankan: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#1F5FA8"
  adaptive_icon_foreground: assets/logo/app_icon_foreground.png
  remove_alpha_ios: true

# Splash screen native → jalankan: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1F5FA8"
  image: assets/logo/splash_logo.png
  android_12:
    color: "#1F5FA8"
    image: assets/logo/splash_logo_android12.png
    icon_background_color: "#1F5FA8"
  fullscreen: false
